    <!-- Conditional PWA setup: Carreira vs AtletaID -->
    <script>
      (function() {
        var CARREIRA_DOMAINS = ['carreiraid.com.br', 'www.carreiraid.com.br'];
        var ATLETAID_DOMAINS = ['atletaid.com.br', 'www.atletaid.com.br'];
        var host = window.location.hostname;
        var isCarreiraDomain = CARREIRA_DOMAINS.indexOf(host) !== -1;
        var isAtletaIdDomain = ATLETAID_DOMAINS.indexOf(host) !== -1;
        var isCarreiraRoute = window.location.pathname.startsWith('/carreira');

        // Update meta tags for AtletaID domain (non-carreira routes)
        if (isAtletaIdDomain && !isCarreiraRoute) {
          document.title = 'ATLETA ID - Gestão Inteligente para Escolinhas de Futebol';
          var metaDesc = document.querySelector('meta[name="description"]');
          if (metaDesc) metaDesc.content = 'Sistema completo de gestão para escolinhas de futebol.';
          var favicon = document.querySelector('link[rel="icon"]');
          if (favicon) favicon.href = '/pwa-icon-192.png';
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle) appleTitle.content = 'ATLETA ID';
          var appName = document.querySelector('meta[name="application-name"]');
          if (appName) appName.content = 'ATLETA ID';
        }

        // Inject Carreira manifest on carreira domain/route
        if (isCarreiraDomain || isCarreiraRoute) {
          var existingManifests = document.querySelectorAll('link[rel="manifest"]');
          existingManifests.forEach(function(el) { el.parentNode.removeChild(el); });
          var link = document.createElement('link');
          link.rel = 'manifest';
          link.href = '/carreira-manifest.json';
          document.head.appendChild(link);
        }

        // Strip stale ?sw-cleanup=... param left over from kill-switch SW
        try {
          if (window.location.search.indexOf('sw-cleanup=') !== -1) {
            var cleanUrl = window.location.pathname + window.location.hash;
            window.history.replaceState({}, '', cleanUrl);
          }
        } catch (e) {}

        if ('serviceWorker' in navigator) {
          // Unregister ALL service workers. The site does not need a SW to run,
          // and stale SWs (carreira-sw.js, workbox, etc.) were blocking
          // carreiraid.com.br from loading on desktop browsers.
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(reg) {
              try { reg.unregister(); } catch (e) {}
            });
          }).catch(function() {});

          // Purge ALL caches left by previous SW versions.
          if (window.caches && caches.keys) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            }).catch(function() {});
          }
        }
      })();
    </script>
